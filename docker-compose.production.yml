services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - erp_internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - file_storage:/app/storage
    networks:
      - erp_internal

  postgres-backup:
    image: postgres:17-alpine
    profiles: ["ops"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      RETENTION_DAYS: ${RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./ops:/ops:ro
    entrypoint: ["/bin/sh", "/ops/postgres-backup-container.sh"]
    networks:
      - erp_internal

  postgres-restore:
    image: postgres:17-alpine
    profiles: ["ops"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      RESTORE_ARCHIVE: ${RESTORE_ARCHIVE:-}
      ALLOW_UNVERIFIED_BACKUP: ${ALLOW_UNVERIFIED_BACKUP:-}
    volumes:
      - ./backups:/backups:ro
      - ./ops:/ops:ro
    entrypoint: ["/bin/sh", "/ops/postgres-restore-container.sh"]
    networks:
      - erp_internal

  storage-backup:
    image: alpine:3.20
    profiles: ["ops"]
    environment:
      RETENTION_DAYS: ${RETENTION_DAYS:-14}
    volumes:
      - file_storage:/data:ro
      - ./backups:/backups
      - ./ops:/ops:ro
    entrypoint: ["/bin/sh", "/ops/storage-backup-container.sh"]

  storage-restore:
    image: alpine:3.20
    profiles: ["ops"]
    environment:
      RESTORE_ARCHIVE: ${RESTORE_ARCHIVE:-}
      ALLOW_UNVERIFIED_BACKUP: ${ALLOW_UNVERIFIED_BACKUP:-}
    volumes:
      - file_storage:/data
      - ./backups:/backups:ro
      - ./ops:/ops:ro
    entrypoint: ["/bin/sh", "/ops/storage-restore-container.sh"]

volumes:
  postgres_data:
  file_storage:

networks:
  erp_internal:
    driver: bridge
