name: ERP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_pedro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_pedro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://erp:erp@localhost:5432/erp_pedro?schema=public
      APP_URL: http://127.0.0.1:3000
      SEED_ADMIN_EMAIL: ci-admin@example.test
      SEED_ADMIN_PASSWORD: ci-password-123
      SEED_ORG_NAME: Pedro CI
      SEED_ORG_SLUG: pedro-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.0.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      - name: Apply committed migrations
        run: pnpm db:deploy

      - name: Seed first tenant and administrator
        run: pnpm db:seed

      - name: Verify tenant isolation and permissions
        run: pnpm test:foundation

      - name: Typecheck
        run: pnpm typecheck

      - name: Build application
        run: pnpm build

      - name: Smoke test login, session and tenant switching
        shell: bash
        run: |
          set -euo pipefail
          pnpm start > /tmp/erp-pedro.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          READY=0
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/erp-pedro.log
            exit 1
          fi

          pnpm test:smoke-auth
